# =============================================================================
# Unity Catalog Resource Definitions
# =============================================================================
# Creates the schema and volume required for the invoice ingestion pipeline.
# These resources are provisioned automatically during bundle deployment.
# =============================================================================

resources:
  # ---------------------------------------------------------------------------
  # Schema Definition
  # ---------------------------------------------------------------------------
  # The schema serves as a namespace for all pipeline tables and the ingestion
  # volume. Name varies by target (dev includes suffix, prod uses base name).

  schemas:
    schema:
      catalog_name: ${var.catalog_name}
      name: ${var.schema_name}

  # ---------------------------------------------------------------------------
  # Volume Definition
  # ---------------------------------------------------------------------------
  # Unity Catalog managed volume where source invoice files are uploaded.
  # Auto Loader in file_ingest monitors this volume for new arrivals.

  volumes:
    volume:
      catalog_name: ${var.catalog_name}
      schema_name: ${resources.schemas.schema.name}
      name: ${var.volume_name}

experimental:
  skip_name_prefix_for_schema: true

